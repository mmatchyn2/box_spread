name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install Android SDK command-line tools
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          curl -sL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -o cmdline-tools.zip -d latest
          rm cmdline-tools.zip
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Install Android SDK components
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Install Gradle
        run: |
          curl -sL -o /tmp/gradle-8.2-bin.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q /tmp/gradle-8.2-bin.zip -d /opt
          echo "GRADLE_HOME=/opt/gradle-8.2" >> $GITHUB_ENV
          echo "/opt/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Build debug APK
        run: gradle assembleDebug
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Run unit tests
        run: gradle test
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: boxspread-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
